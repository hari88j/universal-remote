name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalRemote-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK (smaller, signed with the debug key)
        id: release
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: UniversalRemote-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK as a release (direct download link)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            cp app/build/outputs/apk/release/*.apk dist/UniversalRemote.apk
          else
            cp app/build/outputs/apk/debug/*.apk dist/UniversalRemote.apk
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/UniversalRemote.apk --title "Universal Remote (latest build)" --notes "Built from ${GITHUB_SHA::7}. Download UniversalRemote.apk on your phone and install."
        env:
          GH_TOKEN: ${{ github.token }}
