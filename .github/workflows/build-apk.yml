name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalRemote-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK (smaller, signed with the debug key)
        id: release
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: UniversalRemote-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK as a release (direct download link)
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          mkdir -p dist
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            cp app/build/outputs/apk/release/*.apk dist/UniversalRemote.apk
          else
            cp app/build/outputs/apk/debug/*.apk dist/UniversalRemote.apk
          fi
          NOTES="Built from ${GITHUB_SHA::7}. Download UniversalRemote.apk on your phone and install."
          publish() {
            if gh release view apk > /dev/null 2>&1; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/apk" -f sha="$GITHUB_SHA" -F force=true > /dev/null
              gh release upload apk dist/UniversalRemote.apk --clobber
              gh release edit apk --notes "$NOTES"
            else
              gh release create apk dist/UniversalRemote.apk --target "$GITHUB_SHA" --title "Universal Remote (latest build)" --notes "$NOTES"
            fi
          }
          publish 2>&1 | tee publish.log || { while IFS= read -r l; do echo "::error::$l"; done < publish.log; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
